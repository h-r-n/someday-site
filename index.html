<!doctype html>
<!--
  SOMEDAY の公開ページの入口（https://h-r-n.github.io/someday-site/）。
  公開用のリポジトリ h-r-n/someday-site には、このフォルダ（site/）の中身をそのまま写す（GitHub Pages はルートから配る）。
  ページを足すときは site/<名前>/index.html を作って下の一覧に足す（App Store の申請で privacy/・support/ を置く予定）。
  共通の見た目は assets/site.css。
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SOMEDAY</title>
    <meta
      name="description"
      content="SNS で見つけたパークの投稿を保存して、いつかの旅行の計画に使うアプリ SOMEDAY の公開ページです。"
    />
    <link rel="canonical" href="https://h-r-n.github.io/someday-site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SOMEDAY" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://h-r-n.github.io/someday-site/" />
    <meta property="og:title" content="SOMEDAY" />
    <meta
      property="og:description"
      content="SNS で見つけたパークの投稿を保存して、いつかの旅行の計画に使うアプリ SOMEDAY の公開ページです。"
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="assets/site.css" />
  </head>
  <body>
    <main class="page">
      <p class="brand">SOMEDAY</p>
      <h1>見つけた投稿を、<br />いつかの旅行に</h1>
      <p class="lead">
        SNS
        で見つけたパークの投稿を、共有から保存して見返せるアプリです。このサイトには、アプリの案内のページを置いています。
      </p>
      <div class="card">
        <ul class="links">
          <li>
            <a href="practice/"
              >共有シートの練習<span>初回起動の「共有シートでためす」で使う見本の投稿</span></a
            >
          </li>
        </ul>
      </div>
      <p class="legal">SOMEDAY は、ディズニーとは関係の無い、非公式のファンアプリです</p>
    </main>
  </body>
</html>
